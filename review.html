<body>
<header class="topbar" id="topbar"></header>
<aside class="sidebar" id="sidebar"></aside>

<div class="main">
<main id="review">
  <header class="lesson-head">
    <h1>复习</h1>
    <p class="lesson-lede">从你已经完成的课的自测题里随机抽 10 题，一题一题作答。答错的题会立即给出解释和对应的课，下次复习时优先再出。记录只保存在这台浏览器。</p>
  </header>

  <section class="lesson-block" id="review-stats">
    <h2>各单元正确率</h2>
    <p class="step-hint">按你在复习里的历次作答统计；绿 ≥ 80%，黄 50–79%，红 &lt; 50%。</p>
    <div class="heat-grid" id="review-heat"></div>
    <div id="review-weak"></div>
  </section>

  <section class="lesson-block" id="review-run">
    <h2>本轮题目</h2>
    <div id="review-quiz"></div>
  </section>
</main>
</div>

<script>Academy.init('review');</script>
